# ==============================================================================
# FASE 3 (ClsOpt v2): YOLO26n + Dual-Stage Coordinate Attention (Backbone + Neck)
# - 6x CoordAttYOLO dengan reduction=16 (kapasitas bottleneck 2x lebih kaya)
#   * 3x pada Backbone keluar (P3=layer 5, P4=layer 8, P5=layer 13)
#   * 3x pada Neck PAN-FPN sebelum Detect (P3=layer 20, P4=layer 24, P5=layer 28)
# - 100% kompatibel dengan pemetaan bobot pretrained COCO yolo26n.pt (24 -> 30 layer)
# ==============================================================================

nc: 7
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]             # 0  - P1/2  (orig: 0)
  - [-1, 1, Conv, [128, 3, 2]]            # 1  - P2/4  (orig: 1)
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2  - P2/4  (orig: 2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3  - P3/8  (orig: 3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4  - P3/8  (orig: 4, out_ch=128)
  - [-1, 1, CoordAttYOLO, [128, 16]]      # 5  - Backbone CA-P3 (reduction=16)

  - [-1, 1, Conv, [512, 3, 2]]            # 6  - P4/16 (orig: 5)
  - [-1, 2, C3k2, [512, True]]            # 7  - P4/16 (orig: 6, out_ch=128)
  - [-1, 1, CoordAttYOLO, [128, 16]]      # 8  - Backbone CA-P4 (reduction=16)

  - [-1, 1, Conv, [1024, 3, 2]]           # 9  - P5/32 (orig: 7)
  - [-1, 2, C3k2, [1024, True]]           # 10 - P5/32 (orig: 8)
  - [-1, 1, SPPF, [1024, 5, 3, True]]     # 11 - P5/32 (orig: 9)
  - [-1, 2, C2PSA, [1024]]                # 12 - P5/32 (orig: 10, out_ch=256)
  - [-1, 1, CoordAttYOLO, [256, 16]]      # 13 - Backbone CA-P5 (reduction=16)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (orig: 11)
  - [[-1, 8], 1, Concat, [1]]                  # 15 cat Backbone CA-P4 (orig: 12)
  - [-1, 2, C3k2, [512, True]]                 # 16 (orig: 13, out_ch=128)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (orig: 14)
  - [[-1, 5], 1, Concat, [1]]                  # 18 cat Backbone CA-P3 (orig: 15)
  - [-1, 2, C3k2, [256, True]]                 # 19 (orig: 16, out_ch=64)
  - [-1, 1, CoordAttYOLO, [64, 16]]            # 20 - Neck CA-P3 (sebelum Detect)

  - [-1, 1, Conv, [256, 3, 2]]                 # 21 (orig: 17)
  - [[-1, 16], 1, Concat, [1]]                 # 22 cat Head P4 (orig: 18)
  - [-1, 2, C3k2, [512, True]]                 # 23 (orig: 19, out_ch=128)
  - [-1, 1, CoordAttYOLO, [128, 16]]           # 24 - Neck CA-P4 (sebelum Detect)

  - [-1, 1, Conv, [512, 3, 2]]                 # 25 (orig: 20)
  - [[-1, 13], 1, Concat, [1]]                 # 26 cat Backbone CA-P5 (orig: 21)
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 27 (orig: 22, out_ch=256)
  - [-1, 1, CoordAttYOLO, [256, 16]]           # 28 - Neck CA-P5 (sebelum Detect)

  - [[20, 24, 28], 1, Detect, [nc]]            # 29 Detect(P3, P4, P5) (orig: 23)

