# ==============================================================================
# FASE 3 (DIPERBARUI): YOLO26n + Coordinate Attention (CA)
# Model YAML Resmi Berbasis Arsitektur Asli YOLO26n (Ultralytics)
# ==============================================================================
#
# Perbaikan Kritis dibanding versi sebelumnya:
#   1. Menggunakan arsitektur ASLI YOLO26n (bukan YOLOv8n):
#      - Blok backbone & neck menggunakan C3k2 (bukan C2f)
#      - Menyertakan SPPF [1024, 5, 3, True] dan C2PSA [1024] asli YOLO26n
#      - Menggunakan end2end: True (Dual-Head One-to-One & One-to-Many, NMS-Free)
#      - Menggunakan reg_max: 1 (Direct Box Regression tanpa DFL, ramah Mobile/TFLite)
#   2. Menyisipkan 3 blok CoordAttYOLO pada fitur keluar P3 (layer 5),
#      P4 (layer 8), dan P5 (layer 13) dengan dimensi channel ter-skala
#      nano (width=0.25 -> P3=128, P4=128, P5=256).
#   3. Seluruh indeks Concat dan Detect disesuaikan secara presisi sehingga
#      100% bobot pretrained yolo26n.pt dapat ditransfer melalui remapping layer.
#
# Referensi Paper Coordinate Attention:
#   Hou, Q., Zhou, D., & Feng, J. (2021).
#   "Coordinate Attention for Efficient Mobile Network Design." CVPR 2021.
# ==============================================================================

nc: 7
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels] — identik dengan yolo26n.pt
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ── BACKBONE (YOLO26n Asli + 3 Blok Coordinate Attention) ────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0 - P1/2  (orig idx: 0)
  - [-1, 1, Conv, [128, 3, 2]]            # 1 - P2/4  (orig idx: 1)
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 - P2/4  (orig idx: 2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3 - P3/8  (orig idx: 3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 - P3/8  (orig idx: 4, out_ch=128 pada skala 'n')
  # ► CA-1: Coordinate Attention pada P3/8 (fokus bercak kecil: Tea algal leaf spot, Red Spider)
  - [-1, 1, CoordAttYOLO, [128, 32]]      # 5 - CA-P3 (c1=128 setelah width=0.25, reduction=32)

  - [-1, 1, Conv, [512, 3, 2]]            # 6 - P4/16 (orig idx: 5)
  - [-1, 2, C3k2, [512, True]]            # 7 - P4/16 (orig idx: 6, out_ch=128 pada skala 'n')
  # ► CA-2: Coordinate Attention pada P4/16 (fokus lesi menengah: Brown Blight, Gray Blight, Helopeltis)
  - [-1, 1, CoordAttYOLO, [128, 32]]      # 8 - CA-P4 (c1=128 setelah width=0.25, reduction=32)

  - [-1, 1, Conv, [1024, 3, 2]]           # 9 - P5/32 (orig idx: 7)
  - [-1, 2, C3k2, [1024, True]]           # 10 - P5/32 (orig idx: 8)
  - [-1, 1, SPPF, [1024, 5, 3, True]]     # 11 - P5/32 (orig idx: 9)
  - [-1, 2, C2PSA, [1024]]                # 12 - P5/32 (orig idx: 10, out_ch=256 pada skala 'n')
  # ► CA-3: Coordinate Attention pada P5/32 (fokus konteks daun utuh: Green Mirid Bug, Healthy Leaf)
  - [-1, 1, CoordAttYOLO, [256, 32]]      # 13 - CA-P5 (c1=256 setelah width=0.25, reduction=32)

# ── HEAD / NECK (Identik YOLO26n, terhubung ke fitur CA P3, P4, P5) ──────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (orig idx: 11)
  - [[-1, 8], 1, Concat, [1]]                  # 15 cat backbone P4 (CA-2 output) (orig idx: 12)
  - [-1, 2, C3k2, [512, True]]                 # 16 (orig idx: 13)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (orig idx: 14)
  - [[-1, 5], 1, Concat, [1]]                  # 18 cat backbone P3 (CA-1 output) (orig idx: 15)
  - [-1, 2, C3k2, [256, True]]                 # 19 P3/8-small (orig idx: 16)

  - [-1, 1, Conv, [256, 3, 2]]                 # 20 (orig idx: 17)
  - [[-1, 16], 1, Concat, [1]]                 # 21 cat head P4 (orig idx: 18)
  - [-1, 2, C3k2, [512, True]]                 # 22 P4/16-medium (orig idx: 19)

  - [-1, 1, Conv, [512, 3, 2]]                 # 23 (orig idx: 20)
  - [[-1, 13], 1, Concat, [1]]                 # 24 cat backbone P5 (CA-3 output) (orig idx: 21)
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 25 P5/32-large (orig idx: 22)

  - [[19, 22, 25], 1, Detect, [nc]]            # 26 Detect(P3, P4, P5) end2end=True (orig idx: 23)

